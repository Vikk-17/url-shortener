services:
  backend:
    build:
      context: ./shortener-backend
      dockerfile: Dockerfile
    container_name: shorty_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - shorty_net

  frontend:
    build:
      context: ./shortener-frontend
      dockerfile: Dockerfile
    container_name: shorty_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - shorty_net
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: shorty_redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shorty_net

  prometheus:
    image: prom/prometheus:latest
    container_name: shorty_prometheus
    restart: unless-stopped
    volumes:
      - ./shortener-backend/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    networks:
      - shorty_net
    depends_on:
      - backend

volumes:
  redisdata:
  prometheus_data:

networks:
  shorty_net:
    driver: bridge
